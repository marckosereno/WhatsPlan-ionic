    @font-face {
      font-family: 'Yahoo Sans Bold Regular';

    }
    .category-name { font-family: 'Yahoo Sans Bold Regular', -apple-system, system-ui, sans-serif !important; }
    #topbar { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 9999; display: flex; align-items: center; gap: 8px; pointer-events: auto; }
    #topbar-auth-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex; align-items: center; justify-content: center;
      overflow: visible; cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent; transition: opacity 0.25s, transform 0.25s;
      padding: 0; position: relative;
    }
    #topbar-auth-btn:active { transform: scale(0.9); }
  </style>

  <ion-app animated="false">
    <div id="map-container" class="map-container"></div>

    <div id="topbar">
      <button id="topbar-auth-btn" title="Mi perfil / Login"></button>
    </div>

    <div id="map-results-panel" class="map-results-panel-float">
      <!-- Fila subcategorías: GPS (primer chip) + chips en scroll horizontal -->
      <div class="panel-scroll-wrap">
        <div id="map-subcategories-footer" class="panel-subcats-scroll">
          <!-- GPS skeleton — se reemplaza cuando SubcategoryRow.js arranca -->
          <div class="hm-gps-skeleton"></div>
        </div>
      </div>
      <!-- Fila categorías principales — skeletons pre-render -->
      <div class="panel-scroll-wrap">
        <div id="map-categories-footer" class="panel-categories-scroll">
