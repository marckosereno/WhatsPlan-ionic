<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WhatsPlan">
  <meta name="theme-color" content="transparent">
  <title>WhatsPlan</title>

  <!-- Yahoo Sans Bold — títulos y display (igual que PWA original) -->
  <link href="https://db.onlinewebfonts.com/c/557602b15207c6d67bbdda171a4157dd?family=Yahoo+Sans+Bold+Regular" rel="stylesheet">
  <!-- Inter Tight — cuerpo de texto, UI general -->
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=inter-tight:400,500,600,700&display=swap" rel="stylesheet">

  <!-- Ionic CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css"/>

  <!-- MapLibre GL CSS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="/styles/app.css">
  <link rel="stylesheet" href="/styles/map.css">
</head>
<body>

  <ion-app>
    <!-- Mapa fullscreen -->
    <div id="map"></div>

    <!-- Panel inferior estático 26dvh -->
    <div id="bottom-panel">
      <div class="panel-drag-handle">
        <div class="drag-indicator"></div>
      </div>

      <ion-searchbar
        id="main-searchbar"
        placeholder="Buscar un lugar..."
        animated="true"
        inputmode="search">
      </ion-searchbar>

      <!-- 6 Categorías -->
      <div id="categories-row">

        <button class="category-footer-chip" data-id="rest">
          <div class="category-icon-circle loading">
            <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Hamburger/3D/hamburger_3d.png"
              class="category-icon-3d"
              onload="this.closest('.category-icon-circle').classList.remove('loading')"
              onerror="this.style.display='none';this.closest('.category-icon-circle').classList.remove('loading')"
              alt="">
            <span class="category-icon" style="display:none">🍔</span>
          </div>
          <span class="category-name">Restaurantes</span>
        </button>

        <button class="category-footer-chip" data-id="health">
          <div class="category-icon-circle loading">
            <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Stethoscope/3D/stethoscope_3d.png"
              class="category-icon-3d"
              onload="this.closest('.category-icon-circle').classList.remove('loading')"
              onerror="this.style.display='none';this.closest('.category-icon-circle').classList.remove('loading')"
              alt="">
            <span class="category-icon" style="display:none">🩺</span>
          </div>
          <span class="category-name">Salud</span>
        </button>

        <button class="category-footer-chip" data-id="shop">
          <div class="category-icon-circle loading">
            <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Shopping%20bags/3D/shopping_bags_3d.png"
              class="category-icon-3d"
              onload="this.closest('.category-icon-circle').classList.remove('loading')"
              onerror="this.style.display='none';this.closest('.category-icon-circle').classList.remove('loading')"
              alt="">
            <span class="category-icon" style="display:none">🛍️</span>
          </div>
          <span class="category-name">Compras</span>
        </button>

        <button class="category-footer-chip" data-id="enter">
          <div class="category-icon-circle loading">
            <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Balloon/3D/balloon_3d.png"
              class="category-icon-3d"
              onload="this.closest('.category-icon-circle').classList.remove('loading')"
              onerror="this.style.display='none';this.closest('.category-icon-circle').classList.remove('loading')"
              alt="">
            <span class="category-icon" style="display:none">🎈</span>
          </div>
          <span class="category-name">Entrete.</span>
        </button>

        <button class="category-footer-chip" data-id="parks">
          <div class="category-icon-circle loading">
            <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Cactus/3D/cactus_3d.png"
              class="category-icon-3d"
              onload="this.closest('.category-icon-circle').classList.remove('loading')"
              onerror="this.style.display='none';this.closest('.category-icon-circle').classList.remove('loading')"
              alt="">
            <span class="category-icon" style="display:none">🌵</span>
          </div>
          <span class="category-name">Parques</span>
        </button>

        <button class="category-footer-chip" data-id="work">
          <div class="category-icon-circle loading">
            <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Wrench/3D/wrench_3d.png"
              class="category-icon-3d"
              onload="this.closest('.category-icon-circle').classList.remove('loading')"
              onerror="this.style.display='none';this.closest('.category-icon-circle').classList.remove('loading')"
              alt="">
            <span class="category-icon" style="display:none">🔧</span>
          </div>
          <span class="category-name">Talleres</span>
        </button>

      </div><!-- /categories-row -->
    </div><!-- /bottom-panel -->

  </ion-app>

  <!-- Ionic JS -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- App -->
  <script type="module" src="/src/app.js"></script>

</body>
</html>
