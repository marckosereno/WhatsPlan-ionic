# Compila el APK de Android en la nube (sin PC). Ejecutar a mano:
# GitHub → Actions → "APK Android" → Run workflow. Al terminar, bajar el
# artefacto "whatsplan-debug-apk" (un .zip con app-debug.apk) e instalarlo.
name: APK Android
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build:www
      - run: npx cap sync android
      - name: Compilar APK de depuración
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: whatsplan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
